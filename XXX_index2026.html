<div id="text">Loading...</p>
<script>
    fetch('names.txt')
        .then(response => response.text())
        .then(text => {
            var lists = text.trim().split('\n').map(name => name.trim()).filter(name => name);
            var div = document.getElementById('text');

            var tube_s = "<a href=\"https://youravhost.net/search?q=";
            var tube_e = "\">[Tube]</a>";
            var porn_s = "<a href=\"https://jp.pornhub.com/video/search?search=";
            var porn_e = "\">[Porn]</a>";
            var missav_s = "<a href=\"https://missav.ws/ja/search/";
            var missav_e = "?page=1\">[Missav]</a>";
            var name = "";
            var div_text = "";

            for ( var i = 0;  i < lists.length;  i++  ) {
               name = lists[i];
               div_text += name + "\t\t:" + tube_s + name + tube_e + porn_s + name + porn_e + missav_s + name + missav_e +"<br>";
            }

            div.innerHTML= div_text ;
        });
</script>
