<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Select</title>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const form = document.forms.form1;
  const status = document.getElementById('status');

  try {
    const response = await fetch('./category.txt');
    if (!response.ok) {
      throw new Error(`category.txt の読み込みに失敗しました (${response.status})`);
    }

    const categories = (await response.text())
      .split(/\r?\n/)
      .map(category => category.trim())
      .filter(Boolean);

    categories.forEach((category, index) => {
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.name = 'color1';
      input.value = category;
      input.checked = index === 0;

      const label = document.createElement('label');
      label.append(input, document.createTextNode(` ${category}`));
      form.append(label, document.createElement('br'));
    });

    status.textContent = '';
  } catch (error) {
    status.textContent = error.message;
    console.error(error);
  }
});

function clickBtn1() {
  const selected = Array.from(
    document.querySelectorAll('input[name="color1"]:checked'),
    input => input.value
  );
  const link = document.createElement('a');
  const url = new URL('https://missav.ws/ja/search/');
  url.searchParams.set('search', selected.join(' '));
  link.href = url.toString();
  link.textContent = '[Watch]';

  const output = document.getElementById('text');
  output.replaceChildren(link);
}
</script>
</head>

<body>
<main>
  <form name="form1">
    <span id="status" role="status"></span>
  </form>
  <br>
 <input type="button" value="Make" onclick="clickBtn1()">
  <br>
  <div id="text">...</div>
</main>
</body>
</html>
