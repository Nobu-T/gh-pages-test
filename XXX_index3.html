<!DOCTYPE html>
<html>
<head>
<meta charset=\"UTF-8\">
<title>Select</title>

<script>
function clickBtn1(){
    var div = document.getElementById('text');
    var div_text = \"<a href=\\\"https://jp.pornhub.com/video/search?search=\";
    var div_end = \">[Watch]</a>\";
    var div_cnt = \"\";

    const color1 = document.form1.color1;

    for (let i = 0; i < color1.length; i++){
        if(color1[i].checked){
            div_cnt += color1[i].value + \"　　\";
        }
    }
    div_text += div_cnt + \">\" + div_cnt + \"</a>\";
    div.innerHTML= div_text ;
}
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  fetch('category.txt')
    .then(r => r.text())
    .then(text => {
      const form = document.form1;
      const lines = text.split(/\\\\r?\\\\n/).filter(Boolean);
      lines.forEach((v, i) => {
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.name = 'color1';
        input.value = v;
        if (i === 0) input.checked = true;
        const label = document.createElement('span');
        label.textContent = ' ' + v;
        form.appendChild(input);
        form.appendChild(label);
        form.appendChild(document.createElement('br'));
      });
    })
    .catch(err => console.error('Failed to load category.txt', err));
});
</script>
</head>

<body>
<main>
<form name=\"form1\">
  <!-- checkboxes will be loaded from category.txt -->
</form>

<div id=\"text\">...</p>
</main>
</body>
</html>
