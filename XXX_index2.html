<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Favorite</title>
<style>
  :root{
    --bg:#f6f8fa;
    --card:#ffffff;
    --muted:#6b7280;
    --accent:#2563eb;
    --gap:12px;
    --radius:10px;
  }
  html,body{margin:0;font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;background:var(--bg);color:#111}
  main{max-width:820px;margin:32px auto;padding:20px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:0 6px 20px rgba(16,24,40,0.06);padding:20px}
  h1{margin:0 0 8px;font-size:1.25rem}
  p.lead{margin:0 0 16px;color:var(--muted)}
  #status{display:block;color:#b91c1c;min-height:1.2em;font-size:0.85rem}
  #filter{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #e5e7eb;border-radius:8px;margin:6px 0 16px;font-size:0.95rem}
  .video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--gap)}
  .video-card{border:1px solid #eef2ff;border-radius:8px;padding:12px;background:#fafafa;display:flex;flex-direction:column;gap:8px}
  .video-card h2{margin:0;font-size:1rem;word-break:break-all}
  .video-card code{background:#eef2ff;color:var(--accent);border-radius:4px;padding:1px 5px;font-size:0.85rem}
  .video-card .meta{margin:0;color:var(--muted);font-size:0.85rem;word-break:break-word}
  .video-card .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .video-card .player{display:none}
  .video-card .player.open{display:block}
  .video-card iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:6px;background:#000;display:block}
  button.primary{background:var(--accent);color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:0.9rem}
  button.primary[aria-pressed="true"]{background:#6b7280}
  a.watch-link{display:inline-block;background:#eef2ff;color:var(--accent);padding:6px 10px;border-radius:6px;text-decoration:none;font-size:0.9rem}
  .site-badge{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;font-size:0.7rem;vertical-align:middle;background:#e5e7eb;color:#374151}
  .site-badge.pornhub{background:#fee2e2;color:#b91c1c}
  .site-badge.missav{background:#dcfce7;color:#15803d}
  .video-card .note{color:#b45309;font-size:0.75rem;margin-top:4px}
  @media (max-width:420px){.video-grid{grid-template-columns:1fr}}
</style>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const DEFAULT_IDS = ['ph5dece8674f9e2','ph5c5ba065b2852','ph5d37f06a73886','ph5e64ad2a0a82d','ph5970730ad30fd','ph5e39c5a829036','ph5f668f42e288c'];
  const LIST_URL = './xxx_videos.json';
  const SITES = {
    pornhub: {
      label: 'Pornhub',
      badge: '[Porn]',
      embed: id => `https://www.pornhub.com/embed/${encodeURIComponent(id)}`,
      watch: id => `https://jp.pornhub.com/view_video.php?viewkey=${encodeURIComponent(id)}`
    },
    missav: {
      label: 'MissAV',
      badge: '[MissAV]',
      embed: id => `https://missav.ws/ja/${encodeURIComponent(id)}`,
      watch: id => `https://missav.ws/ja/${encodeURIComponent(id)}`
    }
  };
  const status = document.getElementById('status');
  const grid = document.getElementById('text');
  const countEl = document.getElementById('count');
  const filter = document.getElementById('filter');
  let currentFrame = null;

  function detectSource(video) {
    if (video.source && SITES[String(video.source).toLowerCase()]) return String(video.source).toLowerCase();
    return /^ph[0-9a-f]+$/i.test(video.id) ? 'pornhub' : 'missav';
  }

  async function loadVideos() {
    const response = await fetch(LIST_URL);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    const videos = (Array.isArray(data) ? data : [])
      .map(v => typeof v === 'string' ? {id: v, title: '', date: ''} : v)
      .filter(v => v && v.id)
      .map(v => ({...v, source: detectSource(v)}));
    if (!videos.length) throw new Error('リストが空です');
    return videos;
  }

  function stopCurrent() {
    if (currentFrame) {
      const owner = currentFrame.closest('.video-card');
      currentFrame.remove();
      currentFrame = null;
      const btn = owner && owner.querySelector('button.primary');
      if (btn) {
        btn.textContent = '▶ 再生';
        btn.setAttribute('aria-pressed', 'false');
      }
    }
  }

  function buildCard(video, index) {
    const site = SITES[video.source] || SITES.missav;
    const card = document.createElement('article');
    card.className = 'video-card';
    card.dataset.id = video.id;
    card.dataset.title = video.title || '';
    card.dataset.source = video.source;

    const title = document.createElement('h2');
    title.append(`#${index + 1} `);
    const code = document.createElement('code');
    code.textContent = video.id;
    title.appendChild(code);
    const badge = document.createElement('span');
    badge.className = `site-badge ${video.source}`;
    badge.textContent = site.label;
    title.appendChild(badge);

    const meta = document.createElement('p');
    meta.className = 'meta';
    meta.textContent = [video.title || 'タイトル未設定', video.date || ''].filter(Boolean).join(' / ');

    const controls = document.createElement('div');
    controls.className = 'controls';

    const playBtn = document.createElement('button');
    playBtn.className = 'primary';
    playBtn.type = 'button';
    playBtn.textContent = '▶ 再生';
    playBtn.setAttribute('aria-pressed', 'false');
    playBtn.addEventListener('click', () => {
      const player = card.querySelector('.player');
      const mine = currentFrame && currentFrame.closest('.video-card') === card;
      if (mine) { stopCurrent(); return; }
      stopCurrent();
      const iframe = document.createElement('iframe');
      iframe.src = site.embed(video.id);
      iframe.title = `${site.label} ${video.id}`;
      iframe.setAttribute('allowfullscreen', '');
      iframe.allow = 'autoplay; fullscreen; encrypted-media';
      iframe.referrerPolicy = 'no-referrer';
      iframe.loading = 'lazy';
      player.appendChild(iframe);
      player.classList.add('open');
      currentFrame = iframe;
      playBtn.textContent = '× 閉じる';
      playBtn.setAttribute('aria-pressed', 'true');
    });

    const watch = document.createElement('a');
    watch.className = 'watch-link';
    watch.href = site.watch(video.id);
    watch.target = '_blank';
    watch.rel = 'noopener';
    watch.textContent = site.badge;

    controls.append(playBtn, watch);

    const player = document.createElement('div');
    player.className = 'player';

    card.append(title, meta, controls, player);

    if (video.source === 'missav') {
      const note = document.createElement('p');
      note.className = 'meta note';
      note.textContent = '※サイト側の制限でiframe再生できない場合は [MissAV] リンクから直接開いてください。';
      card.appendChild(note);
    }

    return card;
  }

  function render(videos) {
    countEl.textContent = `保存済み: ${videos.length}件`;
    grid.replaceChildren(...videos.map(buildCard));
  }

  filter.addEventListener('input', () => {
    const q = filter.value.trim().toLowerCase();
    grid.querySelectorAll('.video-card').forEach(card => {
      const hit = !q || `${card.dataset.id} ${card.dataset.title}`.toLowerCase().includes(q);
      card.style.display = hit ? '' : 'none';
    });
  });

  let videos;
  try {
    videos = await loadVideos();
  } catch (error) {
    videos = DEFAULT_IDS.map(id => ({id, title: '', date: '', source: detectSource({id})}));
    status.textContent = `リスト読み込み(${LIST_URL})に失敗したため内蔵リストを表示中 (${error.message})`;
    console.error(error);
  }
  render(videos);
});
</script>
</head>

<body>
<main>
  <div class="card">
    <h1>保存した動画</h1>
    <p class="lead"><span id="count"></span> 「▶ 再生」でページ内プレイヤーを開閉します。</p>
    <span id="status" role="status"></span>
    <input id="filter" type="search" placeholder="ID / タイトルで絞り込み">
    <div id="text" class="video-grid">Loading...</div>
  </div>
</main>
</body>
</html>
